apply plugin: 'com.android.application'

android {
    compileSdkVersion 36
    ndkVersion = '29.0.14206865'
    buildToolsVersion = '36.1.0'

    defaultConfig {
        applicationId 'rp.file'
        namespace 'rp.file'
        minSdkVersion 29
        targetSdkVersion 36
        versionCode 20
        versionName '2.0'
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a"
        }
    }

    signingConfigs {
        debug {
            storeFile file('sign.jks')
            storePassword 'rp.file'
            keyAlias 'rp.file'
            keyPassword 'rp.file'
        }
    }

    dataBinding {
        enabled = true
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled true
            signingConfig = signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    aaptOptions {
        cruncherEnabled false
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packagingOptions {
        jniLibs {
            excludes += ['kotlin/*', 'kotlin/**', 'META-INF/android*', 'META-INF/kotlin*']
        }
        resources {
            excludes += ['kotlin/*', 'kotlin/**', 'META-INF/android*', 'META-INF/kotlin*']
        }
    }

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def abiFilter = output.getFilter(com.android.build.OutputFile.ABI)
            def abiSuffix = abiFilter != null ? "-${abiFilter}" : ""
            output.outputFileName = "bubufile${abiSuffix}-${versionName}-${variant.buildType.name}.apk"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.3.21'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'com.github.bumptech.glide:glide:5.0.7'
    // implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'
    // implementation 'com.arthenica:smart-exception-common:0.2.1'
    // implementation 'com.arthenica:smart-exception-java:0.2.1'
    // implementation 'com.arthenica:ffmpeg-kit-min-gpl:6.0-2'
}

configurations.configureEach {
    // exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    // exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

repositories {
    mavenCentral()
}
